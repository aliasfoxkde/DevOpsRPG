# GitForge CI pipeline (primary CI/CD platform).
# GitHub Actions (.github/workflows/ci.yml) mirrors these checks; GitForge runs
# them first. Jobs use the same npm scripts so both platforms stay in lockstep.
name: devopsquest-ci
version: '1.0'
trigger_on:
  - push
  - pull_request
environment:
  CI: 'true'
jobs:
  - name: lint
    image: node:20
    steps:
      - name: Install dependencies
        run: npm ci
      - name: ESLint (strict type-aware, zero warnings)
        run: npm run lint
      - name: Prettier format check
        run: npm run format:check
      - name: Knip (unused exports, files, dependencies)
        run: npm run knip
  - name: typecheck
    image: node:20
    steps:
      - name: Install dependencies
        run: npm ci
      - name: TypeScript (app, tooling, worker)
        run: npm run typecheck
  - name: test
    image: node:20
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Install worker dependencies
        run: npm ci --prefix worker
      - name: Unit and component tests
        run: npm run test
      - name: Worker KV API tests
        run: npm run test:worker
  - name: e2e
    image: mcr.microsoft.com/playwright:v1.52.0
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Playwright e2e (chromium)
        run: npx playwright test --project=chromium
    timeout: 20m
    retry: 1
  - name: a11y
    image: mcr.microsoft.com/playwright:v1.52.0
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Accessibility audit (WCAG 2.1 AA + AAA strict, 30 routes × 2 themes)
        run: |
          npm run dev -- --port 5173 --strictPort >/tmp/vite.log 2>&1 &
          VITE_PID=$!
          for i in $(seq 1 60); do
            node -e "fetch('http://localhost:5173').then(() => process.exit(0), () => process.exit(1))" >/dev/null 2>&1 && break
            sleep 1
          done
          npm run audit:a11y -- http://localhost:5173 --aaa-strict
          EXIT_CODE=$?
          kill "$VITE_PID" 2>/dev/null || true
          exit "$EXIT_CODE"
    timeout: 20m
    retry: 1
  - name: security
    image: node:20
    steps:
      - name: Install dependencies
        run: npm ci
        # aegis ships with the harness on GitForge runners; the guard keeps the
        # job green on images where it is not installed yet.
      - name: Aegis secret/pattern scan (baseline ratchet)
        run: |
          if command -v aegis >/dev/null 2>&1; then
            npm run audit:secrets
          else
            echo "aegis not installed on this runner; skipping (gate enforced locally)"
          fi
  - name: build
    image: node:20
    needs:
      - lint
      - typecheck
      - test
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Production build (includes tsc -b)
        run: npm run build
